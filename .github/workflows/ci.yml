name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          $files = gofmt -l .
          if ($files) { $files; throw 'Run gofmt on the files above.' }

      - name: Verify modules
        run: |
          go mod tidy -diff
          if ($LASTEXITCODE -ne 0) { throw 'Run go mod tidy.' }
          go mod verify

      # Tests create Walk windows, which need the manifest resource (Common Controls 6).
      - name: Generate Windows resources
        run: go generate ./cmd/epson-downloader

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Test
        run: go test -cover ./...

      - name: Build
        run: ./build.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: EpsonDownloader-${{ github.sha }}
          path: bin/EpsonDownloader.exe
          retention-days: 14
