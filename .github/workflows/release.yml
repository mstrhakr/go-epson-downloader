name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Tests create Walk windows, which need the manifest resource (Common Controls 6).
      - name: Generate Windows resources
        run: go generate ./cmd/epson-downloader

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          ./build.ps1 -Version '${{ github.ref_name }}' -Arch amd64
          ./build.ps1 -Version '${{ github.ref_name }}' -Arch arm64

      - name: Package
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($arch in 'amd64', 'arm64') {
            $exe = if ($arch -eq 'amd64') { 'bin/EpsonDownloader.exe' } else { "bin/EpsonDownloader-$arch.exe" }
            $name = "EpsonDownloader-${{ github.ref_name }}-windows-$arch"
            Copy-Item $exe "dist/$name.exe"
            $stage = "stage/$arch"
            New-Item -ItemType Directory -Force $stage | Out-Null
            Copy-Item $exe "$stage/EpsonDownloader.exe"
            Copy-Item README.md, LICENSE $stage
            Compress-Archive -Path "$stage/*" -DestinationPath "dist/$name.zip"
          }
          Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $flags = @('--generate-notes', '--verify-tag', '--title', "Epson Downloader $tag")
          if ($tag -match '-') { $flags += '--prerelease' }
          gh release create $tag (Get-ChildItem dist -File).FullName @flags
