name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: ./build.ps1 -Version '${{ github.ref_name }}'

      - name: Package
        run: |
          $name = 'EpsonDownloader-${{ github.ref_name }}-windows-amd64'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item bin/EpsonDownloader.exe "dist/$name.exe"
          Compress-Archive -Path bin/EpsonDownloader.exe, README.md, LICENSE -DestinationPath "dist/$name.zip"
          Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $flags = @('--generate-notes', '--verify-tag', '--title', "Epson Downloader $tag")
          if ($tag -match '-') { $flags += '--prerelease' }
          gh release create $tag (Get-ChildItem dist -File).FullName @flags
